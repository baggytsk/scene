# 로컬 개발용 PostgreSQL. bootRun 하면 spring-boot-docker-compose가 이 파일을 보고 켜고,
# 접속 정보도 여기 environment에서 읽어 간다 (application-local.yml 필요 없음).
# 운영 DB(RDS)와 상관없는 로컬 전용 값이다.
services:
  postgres:
    image: postgres:18.7-alpine # 테스트(TestcontainersConfiguration)와 같은 버전으로 맞춘다
    environment:
      POSTGRES_DB: scene
      POSTGRES_USER: scene
      POSTGRES_PASSWORD: scene-local
    ports:
      - "127.0.0.1:5432:5432" # 내 컴퓨터에서만 접속 (같은 와이파이의 다른 기기는 못 붙음)
    volumes:
      - postgres-data:/var/lib/postgresql # PostgreSQL 18 이미지부터 데이터 위치가 이 아래로 바뀜
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scene -d scene"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
