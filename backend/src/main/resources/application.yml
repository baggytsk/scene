spring:
  application:
    name: scene-backend
  jpa:
    # 테이블은 Flyway만 만든다. 엔티티와 스키마가 다르면 시작할 때 실패시킨다
    hibernate:
      ddl-auto: validate
    # 요청이 끝날 때까지 DB 연결을 붙잡아 두지 않는다 (지연 로딩은 서비스 안에서 끝낸다)
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
