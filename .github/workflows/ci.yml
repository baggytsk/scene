name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

# 같은 브랜치에 새 실행이 오면 이전 실행은 취소 (PR 제목만 고쳐도 다시 돌기 때문)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -O "$base/$file" -O "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $file\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$file" gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan history
        run: gitleaks git --redact --verbose .

  # Squash 병합 때 PR 제목이 main 커밋 제목이 된다. 형식은 CONTRIBUTING.md
  pr-title:
    name: PR 제목
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Commits 형식 확인
        env:
          EVENT: ${{ github.event_name }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "PR이 아니라 건너뜀"; exit 0; fi
          pattern='^(feat|fix|refactor|perf|test|docs|ci|build|chore|revert)(\((backend|app|deps)\))?!?: .+'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "통과: $TITLE"
          else
            echo "PR 제목이 형식에 맞지 않습니다: $TITLE"
            echo "예: feat(backend): 카카오 로그인 서버 OAuth  (CONTRIBUTING.md 참고)"
            exit 1
          fi

  backend:
    name: backend build · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - run: ./gradlew build

  app:
    name: app typecheck · web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:web

  # main 보호의 필수 검사는 이 작업 하나만 건다. 작업이 늘면 needs에 더한다.
  ci:
    name: ci
    if: always()
    needs: [secrets, pr-title, backend, app]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "실패한 검사가 있습니다: ${{ toJSON(needs) }}"; exit 1
          fi
